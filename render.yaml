services:
  - type: web
    name: worldcup-prediction
    env: python
    region: singapore
    plan: starter
    buildCommand: pip install -r uploads/worldcup/requirements.txt
    startCommand: cd uploads/worldcup && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATA_DIR
        value: /var/data
      # Which competition the free ESPN scoreboard is polled for.
      # aff.championship = ASEAN Championship (ASEAN Hyundai Cup 2026).
      # Declared here rather than left to the code default so a stale
      # dashboard value from the World Cup can't silently win.
      - key: ESPN_LEAGUE
        value: aff.championship
    disk:
      name: worldcup-data
      mountPath: /var/data
      sizeGB: 1
